{{define "resource_ops.html"}}

<!DOCTYPE html>
<html>
<head>
    <title>Aspace Publisher Launcher</title>
</head>
<body>
<h3>Resource-based operations - step 2</h3>
<p>The resource to be processed: </p>
<table id="resource_metadata">
<tr><td>Resource ID:</td><td>{{ index . "rid" }}</td></tr>
<tr><td>Resource Title:</td><td>{{ index . "rtitle" }}</td></tr>
<tr><td>Resource Identifier:</td><td>{{ index . "ridentifier" }}</td></tr>
</table>
<form action="/launcher2" method="post" enctype="multipart/form-data">
    <input type="hidden" id="resource_id" name="resource_id" value="{{ index . "rid" }}"><br>
    <input type="hidden" id="session" name="session" value="{{ index . "session" }}"><br>

    <p>Choose a workflow:</p>

    <input type="radio" id="validate_ead" name="workflow" value="validate_ead">
    <label for="validate_ead">Validate EAD for Archives West</label><br>

    <input type="radio" id="upload_ead" name="workflow" value="upload_ead">
    <label for="upload_ead">Create/update EAD on Archives West</label><br>

    <input type="radio" id="validate_marc" name="workflow" value="validate_marc">
    <label for="validate_marc">Validate MARC in WorldCat</label><br>

    <input type="radio" id="publish_marc" name="workflow" value="publish_marc">
    <label for="publish_marc">Create/update WorldCat bib</label><br>

    <input type="radio" id="preflight_alma" name="workflow" value="preflight_alma">
    <label for="publish_alma">Alma preflight process report</label><br>

    <input type="radio" id="publish_alma" name="workflow" value="publish_alma">
    <label for="publish_alma">Create/update Alma bib/holding/items</label><br>

    <input type="submit" value="Submit">
</form>
</body>
</html>
{{end}}
